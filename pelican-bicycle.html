<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  :root {
    --bg: #eaf4fb;
    --fg: #1d3557;
    --panel: #ffffff;
    --accent: #2a9d8f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a26;
      --fg: #e6eef5;
      --panel: #182634;
      --accent: #4cc9b0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a26;
    --fg: #e6eef5;
    --panel: #182634;
    --accent: #4cc9b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.05em; }
  .stage {
    width: 100%;
    max-width: 900px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--panel);
    padding: 12px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  button {
    font: inherit;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  label { display: flex; align-items: center; gap: 8px; }
  input[type="range"] { accent-color: var(--accent); width: 160px; }
  .speed-val { min-width: 3.2em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只戴着红色头盔的鹈鹕在乡间小路上骑自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#d8f0ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.5" stop-color="#ffd95a"/>
      <stop offset="1" stop-color="#ffd95a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6b70"/>
      <stop offset="1" stop-color="#4a4a50"/>
    </linearGradient>
  </defs>

  <!-- 天空 & 太阳 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="85" r="70" fill="url(#sunGlow)"/>
  <circle id="sun" cx="660" cy="85" r="32" fill="#ffd23f"/>

  <!-- 滚动背景层（由脚本生成） -->
  <g id="clouds"></g>
  <g id="hillsFar"></g>
  <g id="hillsNear"></g>

  <!-- 地面与道路 -->
  <rect y="388" width="800" height="112" fill="#78b85a"/>
  <rect y="398" width="800" height="62" fill="url(#road)"/>
  <rect y="398" width="800" height="3" fill="#8d8d92"/>
  <rect y="457" width="800" height="3" fill="#3a3a3f"/>
  <g id="dashes"></g>
  <g id="grass"></g>

  <!-- 影子 -->
  <ellipse cx="400" cy="424" rx="150" ry="6" fill="#000" opacity="0.22"/>

  <!-- 自行车 + 鹈鹕 -->
  <g transform="translate(0,22)">
    <!-- 车轮 -->
    <g id="wheelRear">
      <circle cx="300" cy="340" r="60" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="300" cy="340" r="55" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g id="spokesRear" stroke="#c9ccd1" stroke-width="1.4"></g>
      <circle cx="300" cy="340" r="5" fill="#777"/>
    </g>
    <g id="wheelFront">
      <circle cx="500" cy="340" r="60" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="500" cy="340" r="55" fill="none" stroke="#b8bcc2" stroke-width="2"/>
      <g id="spokesFront" stroke="#c9ccd1" stroke-width="1.4"></g>
      <circle cx="500" cy="340" r="5" fill="#777"/>
    </g>

    <!-- 远侧腿 & 曲柄（在车架后面） -->
    <g id="farLeg" opacity="0.75">
      <line id="farCrank" x1="390" y1="345" x2="390" y2="367" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <rect id="farPedal" x="380" y="364" width="20" height="5" rx="2" fill="#333"/>
      <path id="farLegPath" fill="none" stroke="#c9752a" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="farFoot" fill="#c9752a"/>
    </g>

    <!-- 车架 -->
    <g stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M390,345 L300,340 L366,262 Z"/>          <!-- 后下叉、后上叉、立管 -->
      <path d="M366,262 L476,256 L390,345"/>              <!-- 上管、下管 -->
      <path d="M476,256 L484,286"/>                        <!-- 车头管 -->
      <path d="M484,286 L500,340" stroke-width="5"/>       <!-- 前叉 -->
    </g>
    <!-- 链条 -->
    <path d="M300,334 L390,330 M300,346 L390,360" stroke="#444" stroke-width="1.6" fill="none"/>
    <circle cx="390" cy="345" r="15" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="300" cy="340" r="7" fill="none" stroke="#555" stroke-width="2"/>
    <!-- 座杆 & 车座 -->
    <line x1="366" y1="262" x2="362" y2="250" stroke="#999" stroke-width="4"/>
    <path d="M340,248 Q362,240 384,247 Q378,254 360,253 Q345,254 340,248 Z" fill="#222"/>
    <!-- 车把 -->
    <path d="M476,256 L472,232 L494,226" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="489" y1="227" x2="500" y2="224" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <!-- 车灯 -->
    <circle cx="480" cy="270" r="4" fill="#ffe066" stroke="#999" stroke-width="1"/>

    <!-- 鹈鹕上半身（会随踩踏轻微起伏） -->
    <g id="pelican">
      <!-- 尾巴 -->
      <path d="M322,206 L292,196 L298,210 L288,216 L318,222 Z" fill="#dcdcd4" stroke="#b9b9b0" stroke-width="1"/>
      <!-- 身体 -->
      <ellipse cx="372" cy="205" rx="62" ry="40" transform="rotate(-14 372 205)" fill="#f8f8f2" stroke="#d2d2c8" stroke-width="1.5"/>
      <!-- 脖子 -->
      <path d="M412,190 C436,168 418,142 440,118" fill="none" stroke="#d2d2c8" stroke-width="25" stroke-linecap="round"/>
      <path d="M412,190 C436,168 418,142 440,118" fill="none" stroke="#f8f8f2" stroke-width="22" stroke-linecap="round"/>
      <!-- 翅膀（折叠部分） -->
      <path d="M335,190 Q380,166 425,186 Q412,224 360,228 Q330,222 335,190 Z" fill="#e8e8e0" stroke="#c4c4ba" stroke-width="1.2"/>
      <path d="M345,205 Q375,200 405,205 M350,215 Q378,212 400,216" stroke="#c4c4ba" stroke-width="1.2" fill="none"/>
      <!-- 翅膀伸向车把 -->
      <path d="M405,188 Q452,192 496,220 L490,232 Q448,216 400,214 Z" fill="#ecece4" stroke="#c4c4ba" stroke-width="1.2"/>
      <path d="M470,206 Q484,212 496,220 L490,232 Q478,224 464,220 Z" fill="#2f2f2f"/>
      <!-- 头 -->
      <circle cx="445" cy="112" r="20" fill="#f8f8f2" stroke="#d2d2c8" stroke-width="1.2"/>
      <path d="M432,100 Q446,92 460,100" stroke="#f6e7a8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 头盔 -->
      <path d="M424,108 Q428,80 450,80 Q470,82 468,104 Z" fill="#e63946"/>
      <path d="M436,86 L440,104 M452,82 L454,103" stroke="#b02a35" stroke-width="2"/>
      <path d="M424,108 L470,104" stroke="#9d1f2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M430,108 Q428,124 440,128" stroke="#333" stroke-width="1.5" fill="none"/>
      <!-- 眼睛 -->
      <circle cx="453" cy="113" r="5" fill="#fff8d6"/>
      <circle cx="454" cy="113" r="2.8" fill="#1d1d1d"/>
      <circle cx="455" cy="112" r="0.9" fill="#fff"/>
      <!-- 喉囊 -->
      <path id="pouch" d="M462,124 L566,136 Q528,182 476,148 Q464,138 462,124 Z" fill="#f4a340" stroke="#d9852a" stroke-width="1.2"/>
      <!-- 上喙 -->
      <path d="M458,110 L574,128 Q584,132 576,138 L566,136 L460,124 Z" fill="#f7c548" stroke="#d9a52a" stroke-width="1.2"/>
      <path d="M574,128 Q586,132 578,141 Q574,137 568,136 Z" fill="#e07b2a"/>
    </g>

    <!-- 近侧曲柄 & 腿（在车架前面） -->
    <g id="nearLeg">
      <path id="nearLegPath" fill="none" stroke="#e8933a" stroke-linecap="round" stroke-linejoin="round"/>
      <line id="nearCrank" x1="390" y1="345" x2="390" y2="323" stroke="#777" stroke-width="5" stroke-linecap="round"/>
      <circle cx="390" cy="345" r="4" fill="#999"/>
      <rect id="nearPedal" x="380" y="320" width="20" height="5" rx="2" fill="#222"/>
      <path id="nearFoot" fill="#e8933a" stroke="#c9752a" stroke-width="1"/>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <button id="toggle">⏸ 暂停</button>
  <label>速度
    <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
    <span class="speed-val" id="speedVal">1.0×</span>
  </label>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const TILE = 800;

  // ---------- 生成辐条 ----------
  function spokes(g, cx, cy) {
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      el("line", {
        x1: cx + Math.cos(a) * 5, y1: cy + Math.sin(a) * 5,
        x2: cx + Math.cos(a) * 54, y2: cy + Math.sin(a) * 54
      }, g);
    }
  }
  spokes($("spokesRear"), 300, 340);
  spokes($("spokesFront"), 500, 340);

  // ---------- 山丘（周期为 800，画 1600 宽便于循环） ----------
  function hillPath(fn, bottom) {
    let d = `M0,${bottom} `;
    for (let x = 0; x <= TILE * 2; x += 8) d += `L${x},${fn(x).toFixed(1)} `;
    return d + `L${TILE * 2},${bottom} Z`;
  }
  const k = (n) => (2 * Math.PI * n) / TILE;
  el("path", {
    d: hillPath((x) => 320 - 38 * Math.sin(k(2) * x) - 16 * Math.sin(k(3) * x + 1), 400),
    fill: "#a9d18e"
  }, $("hillsFar"));
  el("path", {
    d: hillPath((x) => 362 - 22 * Math.sin(k(3) * x + 0.5) - 9 * Math.sin(k(5) * x), 400),
    fill: "#8cc56b"
  }, $("hillsNear"));

  // ---------- 树（近处山丘上） ----------
  const treeXs = [60, 230, 390, 560, 700];
  for (let t = 0; t < 2; t++) {
    treeXs.forEach((tx, i) => {
      const x = tx + t * TILE;
      const s = 0.8 + (i % 3) * 0.15;
      const base = 380;
      el("rect", { x: x - 4 * s, y: base - 30 * s, width: 8 * s, height: 30 * s, fill: "#7a5230" }, $("hillsNear"));
      el("circle", { cx: x, cy: base - 42 * s, r: 20 * s, fill: i % 2 ? "#4f9a44" : "#3f8a3a" }, $("hillsNear"));
      el("circle", { cx: x - 10 * s, cy: base - 34 * s, r: 13 * s, fill: i % 2 ? "#5aa84d" : "#4a9842" }, $("hillsNear"));
    });
  }

  // ---------- 云 ----------
  const cloudDefs = [[90, 70, 1], [360, 50, 0.8], [560, 120, 0.65]];
  for (let t = 0; t < 2; t++) {
    cloudDefs.forEach(([cx, cy, s]) => {
      const g = el("g", { fill: "#fff", opacity: 0.92 }, $("clouds"));
      const x = cx + t * TILE;
      [[0, 0, 22], [24, -10, 26], [50, 0, 20], [24, 8, 22]].forEach(([dx, dy, r]) =>
        el("circle", { cx: x + dx * s, cy: cy + dy * s, r: r * s }, g));
    });
  }

  // ---------- 路面虚线 & 草丛 ----------
  for (let x = 0; x < TILE * 2; x += 80)
    el("rect", { x, y: 440, width: 40, height: 4, rx: 2, fill: "#f1f1e6" }, $("dashes"));
  for (let x = 10; x < TILE * 2; x += 37) {
    const y = 472 + ((x * 7) % 22);
    el("path", { d: `M${x},${y} l-4,-10 M${x},${y} l0,-13 M${x},${y} l5,-10`, stroke: "#5c9a43", "stroke-width": 2, "stroke-linecap": "round", fill: "none" }, $("grass"));
  }

  // ---------- 腿部反向运动学 ----------
  const HIP = { x: 372, y: 230 };
  const L1 = 66, L2 = 76;          // 大腿、小腿长度
  const BB = { x: 390, y: 345 };   // 中轴
  const CRANK = 22;

  function ik(hx, hy, fx, fy) {
    const dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1 + L2 - 0.5);
    const a = Math.atan2(dy, dx);
    const c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const b = Math.acos(Math.max(-1, Math.min(1, c)));
    const ka = a - b;               // 膝盖朝前
    return { x: hx + Math.cos(ka) * L1, y: hy + Math.sin(ka) * L1 };
  }

  function setLeg(prefix, angle, bob) {
    const px = BB.x + Math.cos(angle) * CRANK;
    const py = BB.y + Math.sin(angle) * CRANK;
    $(prefix + "Crank").setAttribute("x2", px);
    $(prefix + "Crank").setAttribute("y2", py);
    $(prefix + "Pedal").setAttribute("x", px - 10);
    $(prefix + "Pedal").setAttribute("y", py - 2.5);
    const hy = HIP.y + bob;
    const knee = ik(HIP.x, hy, px, py - 3);
    const leg = $(prefix + "LegPath");
    leg.setAttribute("d", `M${HIP.x},${hy} L${knee.x.toFixed(1)},${knee.y.toFixed(1)} L${px.toFixed(1)},${(py - 3).toFixed(1)}`);
    leg.setAttribute("stroke-width", prefix === "near" ? 8 : 7);
    // 蹼足
    const fy = py - 3;
    $(prefix + "Foot").setAttribute("d",
      `M${px - 6},${fy} L${px + 18},${fy - 1} L${px + 15},${fy - 6} L${px + 9},${fy - 3} L${px + 6},${fy - 8} L${px},${fy - 5} Z`);
  }

  // ---------- 动画循环 ----------
  const BASE_SPEED = 240;   // 像素/秒
  const WHEEL_R = 60;
  const GEAR = 1.7;         // 车轮转 1.7 圈 = 曲柄转 1 圈
  let speed = 1, playing = true, last = null;
  let dist = 0, time = 0;

  const layers = [
    [$("clouds"), 0.08],
    [$("hillsFar"), 0.2],
    [$("hillsNear"), 0.45],
    [$("dashes"), 1],
    [$("grass"), 1]
  ];

  function render() {
    for (const [g, f] of layers) {
      const off = -((dist * f) % TILE);
      g.setAttribute("transform", `translate(${off.toFixed(2)},0)`);
    }
    const wheelDeg = (dist / WHEEL_R) * 180 / Math.PI;
    $("spokesRear").setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 300 340)`);
    $("spokesFront").setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 500 340)`);

    const crank = dist / WHEEL_R / GEAR;
    const bob = Math.sin(crank * 2) * 1.8;
    $("pelican").setAttribute("transform", `translate(0,${bob.toFixed(2)})`);
    setLeg("near", crank - Math.PI / 2, bob);
    setLeg("far", crank + Math.PI / 2, bob);

    // 喉囊随风抖动
    const s = 1 + 0.07 * Math.sin(time * 7 * Math.max(speed, 0.4));
    $("pouch").setAttribute("transform", `translate(464 130) scale(1 ${s.toFixed(3)}) translate(-464 -130)`);
  }

  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    if (playing) {
      dist += BASE_SPEED * speed * dt;
      time += dt;
      render();
    }
    requestAnimationFrame(frame);
  }
  render();
  requestAnimationFrame(frame);

  // ---------- 控件 ----------
  $("toggle").addEventListener("click", () => {
    playing = !playing;
    $("toggle").textContent = playing ? "⏸ 暂停" : "▶ 播放";
  });
  $("speed").addEventListener("input", (e) => {
    speed = parseFloat(e.target.value);
    $("speedVal").textContent = speed.toFixed(1) + "×";
  });
})();
</script>
</body>
</html>
